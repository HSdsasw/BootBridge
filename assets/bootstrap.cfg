# This file is embedded in the standalone GRUB image; cmdpath is the EFI executable's directory.
if [ -f "$cmdpath/grub.cfg" ]; then
    configfile "$cmdpath/grub.cfg"
else
    echo "ISO Writer: grub.cfg is missing next to the EFI loader."
    echo "Return to firmware and choose Windows Boot Manager."
    sleep 15
    exit
fi
